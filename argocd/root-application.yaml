apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscaling-applications
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/paideia-code/paideia-poc-kubernetes-autoscaling.git
    targetRevision: main
    path: argocd/applications
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
