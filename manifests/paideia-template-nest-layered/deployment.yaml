apiVersion: apps/v1
kind: Deployment
metadata:
  name: paideia-template-nest-layered
spec:
  selector:
    matchLabels:
      app: paideia-template-nest-layered

  template:
    metadata:
      labels:
        app: paideia-template-nest-layered
    spec:
      containers:
        - name: application
          image: ghcr.io/paideia-code/paideia-template-nest-layered:0.0.1
          ports:
            - name: http
              containerPort: 3000

          env:
            - name: PORT
              value: "3000"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
