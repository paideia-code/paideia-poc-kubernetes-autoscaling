apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: paideia-template-nest-layered
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: paideia-template-nest-layered

  minReplicas: 1
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
